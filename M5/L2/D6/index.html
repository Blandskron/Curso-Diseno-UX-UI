<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>León Responsive</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0e0e0e;
      font-family: system-ui, sans-serif;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: background-image 0.3s ease;
    }

    /* 🖥️ Desktop */
    @media (min-width: 1024px) {
      .hero {
        background-image: url("images/leon-desktop.png");
      }
    }

    /* 📱 Tablet */
    @media (min-width: 768px) and (max-width: 1023px) {
      .hero {
        background-image: url("images/leon-tablet.png");
      }
    }

    /* 📲 Mobile */
    @media (max-width: 767px) {
      .hero {
        background-image: url("images/leon-mobile.png");
      }
    }
  </style>
</head>
<body>

  <div class="hero"></div>

</body>
</html>
